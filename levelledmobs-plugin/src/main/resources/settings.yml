# Раздел 01 |  Настройки
#   ---------------  -  ------------------------------

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ | ОТЛАДКА
# ||  Не изменяйте этот параметр без запроса разработчика LevelledMobs.
# ||  Настройка выводит в консоль подробные сведения о работе плагина.
# ||  Для LevelledMobs 4 рекомендуется использовать команду /lm debug.
debug-misc: [ ]

# ||  Асинхронная проверка обновлений не задерживает запуск сервера.
# ||  Она выполняется один раз при старте и сообщает только о найденном обновлении.
use-update-checker: true

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ
# ||  Если сервер содержит библиотеку Adventure, LevelledMobs будет использовать её.
# ||  CraftBukkit и Spigot не включают Adventure; Paper и его производные включают.
# ||  Рекомендуется оставить параметр включённым.
use-adventure: true

# ||  Уведомлять операторов при входе, если LevelledMobs зарегистрировал ошибки в консоли.
notify-admins-of-errors-upon-join: true

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ
# ||  Не изменяйте без запроса разработчика LevelledMobs.
# ||  На сервере с Adventure значение false включает разбор тегов через MiniMessage.
use-legacy-serializer: true

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ
# ||  Период и радиус асинхронной задачи, которая проверяет уровни, теги и правила мобов.
# ||  Параметры чувствительны к производительности; проверяйте изменения на тестовом сервере.
# DEPRECATED: retained so existing configurations still load; event-driven updates ignore it.
async-task-update-period: 3
# DEPRECATED: retained so existing configurations still load; entity tracking supplies viewers.
async-task-max-blocks-from-player: 320

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ
# ||  Обработчик появления назначает сущностям уровни, пока число игроков не превышает лимит.
# DEPRECATED: mobs are now processed on spawn at every player count.
level-mobs-upon-spawn-max-players: 10

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ
# ||  Обновлять пакеты тегов при уроне от любого источника, пока не превышен лимит игроков.
# ||  После превышения лимита обновление вызывается только уроном от игрока.
# DEPRECATED: event-driven nametag refreshes no longer depend on online player count.
update-mobs-upon-nonplayer-damage-max-players: 5

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ
# ||  Проверять уровни сущностей после загрузки чанка. Значение false отключает обработчик.
ensure-mobs-are-levelled-on-chunk-load: true

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ
# ||  Дополнительная задержка обработки моба в игровых тиках после назначения уровня.
# ||  Помимо этого значения всегда применяется задержка в один тик.
mob-process-delay: 0

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ
# ||  Не отправлять пакеты тегов для уже погибшего моба.
assert-entity-validity-with-nametag-packets: true

# ||  Сообщать игроку о превышении лимита убийств уровневых мобов в чанке.
exceed-kill-in-chunk-message: true

# ||  Жёсткий лимит числа сущностей для одной команды призыва LevelledMobs.
customize-summon-command-limit: 10

# ||  Максимальное расстояние от игрока для появления мобов по команде призыва.
summon-command-spawn-max-distance-from-player: 5

# ||  Минимальное расстояние от игрока для появления мобов по команде призыва.
summon-command-spawn-min-distance-from-player: 3

# ||  Не изменяйте без запроса разработчика LevelledMobs.
# ||  Жёсткий лимит числа повторений пользовательской команды из системы дропа.
customcommand-amount-limit: 100

# ||  Показывать в тегах имя моба на языке клиента.
# ||  Старые или модифицированные клиенты могут вместо имени показать ключ перевода.
use-translation-components: true

# ||  Минимальный период повторной проверки стратегии уровней от игрока.
player-levelling-relevel-min-time: 5s

# ||  Максимальное расстояние до сущности для плейсхолдера `%levelledmobs_mob-target%`.
nametag-placeholder-maxblocks: 30

# ||  Отключить теги LevelledMobs для игроков Java Edition.
disable-nametag-java: false

# ||  Отключить теги LevelledMobs для игроков Bedrock Edition.
disable-nametag-bedrock: false

# ||  Условия, при которых команда kill пропускает моба и не убивает его.
kill-skip-conditions:
  is-nametagged: true
  is-tamed: true
  is-leashed: true
  is-transforming: true
  is-villager: true
  entitytype:
    included-groups: ['all_passive_mobs']
    included-list: ['']

# ||  Применять ли множитель дропа LevelledMobs к головам мобов.
# ||  По умолчанию отключено, чтобы не нарушать экономику серверов с ценными головами.
mobs-multiply-head-drops: false

# ||  Проверять актуальность правил каждого моба по сохранённому хешу.
check-mob-hash: true

# ||  Выводить результат команды призыва в консоль или выполнившему её игроку.
print-lm-summon-results: true

# ||  ТОЛЬКО ДЛЯ ОПЫТНЫХ ПОЛЬЗОВАТЕЛЕЙ
# ||  Период очистки кэша LEW (LivingEntityWrapper).
lew-cache-clear-period: 3m

# ||  Исключать игроков в творческом режиме при расчёте модификатора уровня игрока.
exclude-players-in-creative: false

# ||  При включённом PVM игнорировать мобов без связанного игрока.
# ||  Полезно для формул характеристик, которым необходим контекст игрока.
ignore-mobs-with-no-player-context: false

# ||  Приоритеты обработчиков событий.
event-priorities:
  # Допустимые значения: lowest, low, normal, high, highest, monitor.
  entity-damage-event: 'monitor'
  entity-death-event: 'normal'
  entity-spawn-event: 'monitor'
  entity-transform-event: 'monitor'
  player-death-event: 'normal'

# ||  Классы и активные способности мобов «Судной недели» уровня 300+.
judgement-week-archetypes:
  enabled: true
  artifact-chance-multiplier: 1.5
  chances:
    300-449: 0.10
    450-599: 0.15
    600-749: 0.25
    750-899: 0.40
    900-998: 0.60
    '999': 1.0
  classes:
    berserker:
      display: '&c[Берсерк]'
      passive: { outgoing-damage: 1.25, movement-speed: 1.15 }
      ability: { health-threshold: 0.40, duration: 8s, damage-multiplier: 1.25, movement-speed: 1.20 }
    bastion:
      display: '&7[Бастион]'
      passive: { max-health: 1.35, armor-bonus: 6.0, armor-toughness: 3.0, knockback-resistance: 0.35, movement-speed: 0.90 }
      ability: { cooldown: 8s, incoming-damage: 0.50 }
    vampire:
      display: '&4[Вампир]'
      passive: { outgoing-damage: 1.10, movement-speed: 1.10 }
      ability: { cooldown: 2s, healing-fraction: 0.30, healing-cap: 8.0 }
    plague:
      display: '&2[Чумной]'
      passive: { max-health: 1.20, follow-range: 1.30 }
      ability: { cooldown: 7s, poison-level: 2, poison-duration: 4s, weakness-level: 1, weakness-duration: 3s }
    thunderer:
      display: '&b[Громовержец]'
      passive: { outgoing-damage: 1.15, attack-knockback: 0.35 }
      ability: { cooldown: 8s, bonus-damage: 4.0 }
  bosses:
    dragon-tempest:
      display: '&5[Повелитель Бури]'
      passive: { outgoing-damage: 1.15, flying-speed: 1.15 }
      ability: { cooldown: 12s, radius: 8.0, horizontal-force: 1.20, vertical-force: 0.35 }
    wither-necromancer:
      display: '&8[Некромант]'
      passive: { max-health: 1.15, outgoing-damage: 1.10 }
      ability: { cooldown: 2s, healing-fraction: 0.20, healing-cap: 10.0, health-threshold: 0.50, phase-radius: 10.0, wither-level: 2, wither-duration: 5s }
    warden-resonance:
      display: '&1[Абсолютный Резонанс]'
      passive: { max-health: 1.15, knockback-resistance: 0.40 }
      ability: { cooldown: 10s, bonus-damage: 6.0, darkness-level: 1, darkness-duration: 4s }
    elder-abyss:
      display: '&3[Владыка Глубин]'
      passive: { max-health: 1.20, armor-bonus: 6.0 }
      ability: { cooldown: 8s, slowness-level: 3, slowness-duration: 5s, fatigue-level: 2, fatigue-duration: 8s }

