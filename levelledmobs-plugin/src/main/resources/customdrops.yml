CREEPER:
  # Крипер 999 уровня становится заряженным через один тик после применения уровня.
  # PDC-фильтр не позволяет команде затронуть обычного или не-999 крипера.
  - customCommand:
      name: jw_charge_level_999_creeper
      command:
        - 'minecraft:execute in minecraft:overworld positioned %x% %y% %z% as @e[type=minecraft:creeper,distance=..2,sort=nearest,limit=1,nbt={powered:0b,BukkitValues:{"levelledmobs:level":999}}] run data merge entity @s {powered:1b}'
        - 'minecraft:execute in minecraft:the_nether positioned %x% %y% %z% as @e[type=minecraft:creeper,distance=..2,sort=nearest,limit=1,nbt={powered:0b,BukkitValues:{"levelledmobs:level":999}}] run data merge entity @s {powered:1b}'
        - 'minecraft:execute in minecraft:the_end positioned %x% %y% %z% as @e[type=minecraft:creeper,distance=..2,sort=nearest,limit=1,nbt={powered:0b,BukkitValues:{"levelledmobs:level":999}}] run data merge entity @s {powered:1b}'
