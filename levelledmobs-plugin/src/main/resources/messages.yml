#   ---------------  -  ------------------------------
# Раздел 01 |  Общие сообщения
#   ---------------  -  ------------------------------
#
common:
  prefix: '&b&lLevelledMobs:&7'
  no-permission:
    - '%prefix% Недостаточно прав для выполнения этой команды.'
  players-only:
    - '%prefix% Эта команда доступна только игрокам.'
  player-offline:
    - '%prefix% Игрок ''&r%player%&7'' не в сети.'
  invalid-command:
    - '%prefix% Неизвестная команда.'
  not-available-on-folia:
    - '%prefix% Эта команда недоступна на Folia.'
  invalid-time:
    - '%prefix% Некорректный интервал времени: &b%input%&7.'
  invalid-time-unit:
    - '%prefix% Некорректная единица времени: &b%input%&7 (&b%unit%&7).'


#
#   ---------------  -  ------------------------------
# Раздел 02 |  Командные сообщения по умолчанию
#   ---------------  -  ------------------------------
#
command:
  descriptions:
    main: 'Управление плагином LevelledMobs'
    debug: 'Команды диагностики и отладки.'
    info: 'Сведения об установленной версии плагина.'
    reload: 'Перезагрузка файлов конфигурации LevelledMobs.'
    kill: 'Команды массового удаления уровневых мобов.'
    rules: 'Просмотр действующих правил.'
    spawner-egg: 'Команды создания яиц призыва.'
    spawner: 'Команды создания и изменения спавнеров.'
    summon: 'Команды призыва мобов.'
  levelledmobs:
    fallback-options:
      - '%prefix% Доступные варианты: reload / info / show-errors'
    main-usage:
      - '%prefix% Доступные команды:'
      - '&8 &m->&b /%label% debug &8- &7команды диагностики'
      - '&8 &m->&b /%label% egg &8- &7создание яиц призыва'
      - '&8 &m->&b /%label% help &8- &7ссылка на wiki'
      - '&8 &m->&b /%label% info &8- &7информация о плагине'
      - '&8 &m->&b /%label% kill &8- &7массовое удаление уровневых мобов'
      - '&8 &m->&b /%label% reload &8- &7перезагрузка конфигурации'
      - '&8 &m->&b /%label% rules &8- &7просмотр системы правил'
      - '&8 &m->&b /%label% summon &8- &7призыв уровневых мобов'


    #
    #   ---------------  -  ------------------------------
    # Раздел 03 |  Командные сообщения вызова
    #   ---------------  -  ------------------------------
    #
    summon:
      invalid-amount:
        - '%prefix% Некорректное количество: ''&b%amount%&7''.'
      invalid-entity-type:
        - '%prefix% Некорректный тип сущности: ''&b%entityType%&7''.'
      invalid-level:
        - '%prefix% Некорректный уровень: ''&b%level%&7''.'
      invalid-summon-type:
        - '%prefix% Некорректный способ призыва: ''&b%summonType%&7''.'
      invalid-summon-type-console:
        - '%prefix% Способ ''&bhere''&7 доступен только игрокам. Используйте ''&batPlayer&7'' или ''&batLocation&7''.'
      invalid-location:
        - '%prefix% Некорректное местоположение.'
      no-safe-location:
        - '%prefix% Подходящее безопасное место для появления не найдено.'
      nbt-error:
        - '%prefix% Не удалось применить NBT к %entity%: %error%'
      here:
        usage:
          - '%prefix% Использование: &b/%label% summon <amount> <entity> <level> here'
        success:
          - '%prefix% Призвано сущностей &b%entity%: &b%amount%&7, уровень &f%level%&7, в текущей позиции.'
      atLocation:
        usage:
          - '%prefix% Использование: &b/%label% summon <amount> <entity> <level> atLocation <x> <y> <z> [world]'
        success:
          - '%prefix% Призвано сущностей &b%entity%: &b%amount%&7, уровень &f%level%&7, координаты &8(&b%x%&7, &b%y%&7, &b%z%&7, мир ''&b%world%&7''&8)&7.'
        usage-console:
          - '%prefix% Использование из консоли: &b/%label% summon <amount> <entity> <level> atLocation <x> <y> <z> <world>'
        invalid-world:
          - '%prefix% Некорректный мир: ''&b%world%&7''.'
        invalid-location:
          - '%prefix% Некорректное местоположение.'
      atPlayer:
        usage:
          - '%prefix% Использование: &b/%label% summon <amount> <entityType> <level> atPlayer <player>'
        success:
          - '%prefix% Призвано сущностей &b%entity%: &b%amount%&7, уровень &f%level%&7, возле игрока &r%targetDisplayname%&7.'
      usage:
        - '%prefix% Синтаксис команды призыва:'
        - '&8 &m->&b /%label% summon <amount> <entity> <level> here'
        - '&8 &m->&b /%label% summon <amount> <entity> <level> atPlayer <player>'
        - '&8 &m->&b /%label% summon <amount> <entity> <level> atLocation <x> <y> <z> [world]'
      amount-limited:
        min:
          - '%prefix% Минимальное количество для призыва: &b1&7.'
        max:
          - '%prefix% Максимальное количество для призыва: &b%maxAmount%&7.'
      level-limited:
        min:
          - '%prefix% Минимальный уровень: &b%minLevel%&7.'
        max:
          - '%prefix% Максимальный уровень: &b%maxLevel%&7.'
      not-levellable:
        - '%prefix% Для сущности &b%entity%&7 нельзя назначить уровень.'


    #
    #   ---------------  -  ------------------------------
    # Раздел 04 |  Сообщения команды уничтожения
    #   ---------------  -  ------------------------------
    #
    kill:
      levels-value-missing:
        - '%prefix% Не указано значение параметра /levels.'
      levels-value-invalid:
        - '%prefix% Для /levels указано некорректное число или диапазон.'
      usage:
        - '%prefix% Использование: &b/%label% kill <all/near>'
      all:
        invalid-world:
          - '%prefix% Некорректный мир: ''&b%world%&7''.'
        success:
          - '%prefix% Удалено уровневых мобов: &b%killed%&7; миров: &b%worlds%&7 &8(&b%skipped%&7 пропущено&8)&7.'
        usage:
          - '%prefix% Использование: &b/%label% kill all [world/*]'
        usage-console:
          - '%prefix% Использование из консоли: /%label% kill all <world/*>'
      near:
        invalid-radius:
          - '%prefix% Некорректный радиус: ''&b%radius%&7''.'
        invalid-radius-min:
          - '%prefix% Радиус увеличен до минимального значения &8(&b%minRadius%&8)&7.'
        invalid-radius-max:
          - '%prefix% Радиус уменьшен до максимального значения &8(&b%maxRadius%&8)&7.'
        success:
          - '%prefix% В радиусе &b%radius%&7 блоков удалено уровневых мобов: &b%killed%&7 &8(&b%skipped%&7 пропущено&8)&7.'
        usage:
          - '%prefix% Использование: &b/%label% kill near <radius>'
        usage-console:
          - '%prefix% Команда kill near доступна только игроку.'


    #
    #   ---------------  -  ------------------------------
    # Раздел 05 |  Командные сообщения спавнера
    #   ---------------  -  ------------------------------
    #
    spawner:
      invalid-spawn-type:
        - '%prefix% Некорректный тип сущности: &b%value%&7.'
      usage:
        - '%prefix% Синтаксис команды спавнера:'
        - '&8 &m->&b /%label% spawner create'
        - '&8 &m->&b /%label% spawner copy'
        - '&8 &m->&b /%label% spawner info'
        - ' '
        - '&fПример:'
        - '&8 &m->&b /%label% spawner create &3/minlevel&b 1 &3/maxlevel&b 10 &3/name&b "Настроенный спавнер LM" &3/customDropId&b Id1'
      no-value:
        - '%prefix% Не указано значение параметра ''&b%keyname%&7''.'
      no-player:
        - '%prefix% Команда доступна только игроку, если не указан параметр &b/giveplayer&7.'
      no-player-specified:
        - '%prefix% Игрок не указан.'
      invalid-value:
        - '%prefix% Значение &b%keyname%&7 должно быть числом.'
      no-level-specified:
        - '%prefix% Необходимо указать minLevel и/или maxLevel.'
      inventory-full:
        - '%prefix% В инвентаре нет свободного места.'
      spawner-give-message:
        - '%prefix% Получен спавнер LM.'
      spawner-give-message-console:
        - '%prefix% Игроку &r%playername%&7 выдан спавнер LM. &8|&7 минимальный уровень: &b%minlevel%&7, максимальный уровень: &b%maxlevel%&7'
      permission-denied:
        - '%prefix% Недостаточно прав для обновления или преобразования спавнера LM.'
      spawner-converted:
        - '%prefix% Обычный спавнер преобразован в спавнер LM с именем "%spawnername%".'
      spawner-updated:
        - '%prefix% Спавнер LM обновлён с помощью яйца призыва. Имя: "%spawnername%"'
      info:
        status-enabled:
          - '%prefix% Просмотр информации о спавнере &aвключён&f.'
        status-not-enabled:
          - '%prefix% Просмотр информации о спавнере &cвыключен&f.'
        enabled:
          - '%prefix% Просмотр информации &aвключён&f. Нажмите ПКМ по спавнеру.'
        disabled:
          - '%prefix% Просмотр информации о спавнере &cвыключен&f.'
      copy:
        vanilla-spawner:
          - '%prefix% Копирование доступно только для спавнеров LM.'
        status-enabled:
          - '%prefix% Копирование спавнеров &aвключено&f.'
        status-not-enabled:
          - '%prefix% Копирование спавнеров &cвыключено&f.'
        enabled:
          - '%prefix% Копирование &aвключено&f. Нажмите ПКМ по спавнеру LM с пустой рукой.'
          - 'Рука должна быть пустой.'
        disabled:
          - '%prefix% Копирование спавнеров &cвыключено&f.'


    #
    #   ---------------  -  ------------------------------
    # Раздел 06 |  Сообщения команд спауна яйца
    #   ---------------  -  ------------------------------
    #
    spawn_egg:
      invalid-spawn-type:
        - '%prefix% Некорректный тип сущности: &b%value%&7.'
      invalid-material:
        - '%prefix% Некорректный материал: &b%material%&7.'
      usage:
        - '%prefix% Синтаксис команды egg:'
        - '&8 &m->&b /%label% egg /minlevel <level> /maxlevel <level> /entity <entity type>'
        - '&7&oПример яйца призыва'
        - '&7/%label% egg &b/minlevel&7 1 &b/maxlevel&7 10 &b/name&7 "Настроенное яйцо LM" &b/customDropId&7 Id1'
      no-paper:
        - '%prefix% Функция доступна только на Paper и его форках.'
      no-value:
        - '%prefix% Не указано значение параметра: &b%keyname%&7'
      no-player:
        - '%prefix% Команда доступна только игроку, если не указан /giveplayer.'
      no-player-specified:
        - '%prefix% Игрок не указан.'
      invalid-value:
        - '%prefix% Значение &b%keyname%&7 должно быть числом.'
      no-level-specified:
        - '%prefix% Необходимо указать minLevel, maxLevel и entity.'
      inventory-full:
        - '%prefix% &4В инвентаре нет свободного места.'
      give-message:
        - '%prefix% Получено яйцо призыва LM.'
      give-message-console:
        - '%prefix% Игроку &r%playername%&7 выдано яйцо LM. &8|&7 минимальный уровень: &b%minlevel%&7, максимальный уровень: &b%maxlevel%&7, entity: &b%entitytype%&7'


    #
