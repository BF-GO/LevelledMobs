#   ---------------  -  ------------------------------
# Раздел 01 |  Пресеты
#   ---------------  -  ------------------------------
#
presets:
#
#   ---------------  -  ------------------------------
# Раздел 01 - А |  Пресеты/Стратегии выравнивания
#   ---------------  -  ------------------------------
#
  lvlstrategy-random:
    name: 'Стратегия уровня — случайная'
    strategies:
      random: true

  lvlstrategy-weighted-random:
    name: 'Стратегия уровня — взвешенная случайная'
    strategies:
      weighted-random:
        11-50: 0
        5-10: 1
        4-8: 10
        3-6: 25
        2-4: 50
        1-2: 100

  lvlstrategy-distance-from-origin:
    name: 'Стратегия уровня — расстояние от начала координат'
    strategies:
      distance-from-origin:
        origin-coordinates:
          x: spawn
          z: spawn
        buffer-distance: 250
        ringed-tiers: 750
      # Модификатор высоты Y
        enable-height-modifier: true
        transition-y-height: 62
        y-height-period: 15
        level-multiplier: 0.05
        scale-increase-downward: true

  lvlstrategy-y-coordinate:
    name: 'Стратегия уровня — координата Y'
    strategies:
      y-coordinate:
        start-height: 100
        period: 0
        end-height: 20


#
#   ---------------  -  ------------------------------
# Раздел 01 - Б |  Пресеты/модификаторы уровней
#   ---------------  -  ------------------------------
#
  lvlmodifier-player-variable:
    name: 'Модификатор уровня — переменная игрока'
    modifiers:
      player-variable-mod:
        player-variable: '%level%'
        player-variable-scale: 1.0
        player-variable-tiers:
          '31-45': 3-7
          '16-30': 2-5
          '0-15': 1-3
          default: 1
        match-variable: false
        use-variable-as-max: false
        recheck-players: true
        decrease-output: true
        output-cap: 25
        preserve-entity: 5s

  lvlmodifier-custom-formula:
    name: 'Модификатор уровня — пользовательская формула'
    modifiers:
      custom:
        formula: '1 * %mob-lvl%'
      custom_special:
        formula: '%attack-damage% * 0.2'
      custom_nether:
        formula: '%rand_-3_3% + %player-variable-mod%'
      custom_end:
        formula: '%rand_-3_3% + %player-variable-mod%'


#
#   ---------------  -  ------------------------------
# Раздел 01 - В |  Пресеты сложности
#   ---------------  -  ------------------------------
#
  challenge-vanilla:
    name: 'Сложность с обычными характеристиками'
    settings:
      attribute-modifier:
        merge: false
        max-health: 0.0
        attack-damage: 0.0
        ranged-attack-damage: 0.0
        item-drop: 0.0
        xp-drop: 0.0

  challenge-bronze:
    name: 'Бронзовая сложность'
    settings:
      attribute-modifier:
        merge: false
        max-health: 2.5
        attack-damage: 1.0
        ranged-attack-damage: 0.7
        item-drop: 3.0
        xp-drop: 5.0

  challenge-silver:
    name: 'Серебряная сложность'
    settings:
      attribute-modifier:
        merge: false
        max-health: 5.0
        movement-speed: 0.15
        attack-damage: 2.25
        ranged-attack-damage: 1.5
        creeper-blast-damage: 0.75
        item-drop: 3.0
        xp-drop: 5.0
      # Специальные множители (0,0 мин. – 1,0 макс.)
        armor-bonus: 0.2
        armor-toughness: 0.15

  challenge-gold:
    name: 'Золотая сложность'
    settings:
      attribute-modifier:
        merge: false
        max-health: 8.0
        movement-speed: 0.35
        attack-damage: 3.5
        ranged-attack-damage: 2.0
        creeper-blast-damage: 1.75
        follow-range: 0.25
        item-drop: 3.0
        xp-drop: 5.0
      # Специальные множители (0,0 мин. – 1,0 макс.)
        armor-bonus: 0.3
        armor-toughness: 0.3
        attack-knockback: 0.5
        knockback-resistance: 0.5

  challenge-platinum:
    name: 'Платиновая сложность'
    settings:
      attribute-modifier:
        merge: false
        max-health: 15.0
        movement-speed: 1.0
        attack-damage: 5.0
        ranged-attack-damage: 3.2
        creeper-blast-damage: 2.5
        follow-range: 0.5
        item-drop: 3.0
        xp-drop: 5.0
      # Специальные множители (0,0 мин. – 1,0 макс.)
        armor-bonus: 0.5
        armor-toughness: 0.5
        attack-knockback: 0.5
        knockback-resistance: 0.5
        zombie-spawn-reinforcements: 0.15

  challenge-formula:
    name: 'Сложность по пользовательской формуле'
    settings:
      attribute-modifier:
        merge: false
        max-health: '(%level-ratio% * %max-health% * 5)'
        movement-speed: '(%level-ratio% * %movement-speed% * 0.25)'
        attack-damage: '(%level-ratio% * %attack-damage% * 2)'
        ranged-attack-damage: '(%level-ratio% * %ranged-attack-damage% * 1.50)'
        creeper-blast-damage: '(%level-ratio% * %creeper-blast-damage% * 2.5)'
        follow-range: '(%level-ratio% * %follow-range% * 0.5)'
        item-drop: '(%level-ratio% * %item-drop% * 2)'
        xp-drop: '(%level-ratio% * %xp-drop% * 5)'
        # Специальные множители (0,0 мин. – 1,0 макс.)
        armor-bonus: '(%level-ratio% * (7.5 - %armor-bonus%))'
        armor-toughness: '(%level-ratio% * (3.5 - %armor-toughness%))'
        attack-knockback: '(%level-ratio% * (2 - %attack-knockback%))'
        knockback-resistance: '(%level-ratio% * (0.25 - %knockback-resistance%))'
        zombie-spawn-reinforcements: '(%level-ratio% * (0.25 - %zombie-spawn-reinforcements%))'


#
#   ---------------  -  ------------------------------
# Раздел 01 - Г |  Пресеты дополнительных параметров
#   ---------------  -  ------------------------------
#
  nametag-using-numbers:
    name: 'Тег — здоровье числами'
    settings:
      nametag: ' &fꓡꓦꓡ%tiered%%mob-lvl% &8&l༺&r %displayname% &8&l༻ %health-indicator-color%%entity-health-rounded%&fꓧꓑ '
      creature-death-nametag: '%tiered%Ур. %mob-lvl%&8 | &f%displayname%'

  nametag-using-indicator:
    name: 'Тег — здоровье индикаторами'
    settings:
      nametag: ' &fꓡꓦꓡ%tiered%%mob-lvl% &8&l༺ &r%displayname% &8&l༻ %health-indicator% '
      creature-death-nametag: '%tiered%Ур. %mob-lvl%&8 | &f%displayname%'
      health-indicator:
        indicator: '█'
        indicator-half: '▌'
        maintain-space: false
        merge: true

  nametag-minimized:
    name: 'Тег — сокращённый'
    settings:
      nametag: ' &f%displayname%&8 &8&l༻ %health-indicator-color%%entity-health-rounded%&fꓧꓑ '
      creature-death-nametag: '&f%displayname% %tiered%%heart-symbol%'

  nametag-disabled:
    name: 'Тег — отключён'
    settings:
      nametag: disabled
      nametag-visibility-method: [ 'DISABLED' ]
      creature-death-nametag: '&f%displayname% %tiered%%heart-symbol%'

  custom-death-messages:
    name: 'Пользовательские сообщения о смерти'
    settings:
      death-messages:
        5: ['%player% погиб от %death_nametag%!']
        4: ['%death_nametag% сокрушил %player%!']
        3: ['%death_nametag% одолел %player%!']
        2: ['%player% не смог противостоять %death_nametag%']
        1: ['%player% погиб | Причина: %death_nametag%']


#
#   ---------------  -  ------------------------------
# Раздел 02 |  Создатель пользовательских групп мобов и биомов
#   ---------------  -  ------------------------------
#
mob-groups:
  undead_mobs:
    - ZOMBIE
    - HUSK
    - DROWNED

biome-groups:
  cave_biomes:
    - LUSH_CAVES
    - DRIPSTONE_CAVES
    - DEEP_DARK


#
#   ---------------  -  ------------------------------
# Раздел 03 |  Установите правило по умолчанию
#   ---------------  -  ------------------------------
#
default-rule:
  use-preset:
    #===== Выберите сложность =====
    #- challenge-vanilla
    #- challenge-bronze
    - challenge-silver
    #- challenge-gold
    #- challenge-platinum
    #- challenge-formula
    
    #===== Выберите стратегии =====
    #- lvlstrategy-random
    - lvlstrategy-weighted-random
    - lvlstrategy-distance-from-origin
    #- lvlstrategy-y-coordinate

    #===== Выберите модификаторы =====
    - lvlmodifier-player-variable
    - lvlmodifier-custom-formula

    #===== Выберите дополнительные параметры =====
    - nametag-using-numbers
    #- nametag-using-indicator
    #- nametag-minimized
    #- nametag-disabled
    #- custom-death-messages


#
#   ---------------  -  ------------------------------
# Раздел 03 - А |  Правило/условия по умолчанию
#   ---------------  -  ------------------------------
#
  conditions:
    worlds: ['*']
    #biomes: ['*']
    entities: ['*']

    mob-customname-status: EITHER
    mob-tamed-status: EITHER
#
#   ---------------  -  ------------------------------
# Раздел 03 - Б |  Правило/Настройки по умолчанию
#   ---------------  -  ------------------------------
#
  settings:
  # Основные настройки LevelledMobs
    minLevel: 1
    maxLevel: 50

    construct-level: '%distance-from-origin% + %weighted-random% + %player-variable-mod% + %custom_special% + %rand_-5_5%'

  # Настройки пользовательского дропа
    use-custom-item-drops-for-mobs: true

  # Дополнительные настройки бейджа
    nametag-placeholder-levelled: ''
    nametag-placeholder-unlevelled: ''
    nametag-visible-time: 5s
    nametag-visibility-method: [ 'TARGETED', 'ATTACKED', 'TRACKING' ]

  # Настраивает заполнители `%tiered%` и `%health-indicator-color%`.
    tiered-coloring:
      1-09: '&#22E76B' # Зелёный
      10-19: '&#528CFF' # Синий
      20-29: '&#FFCD56' # Жёлтый
      30-39: '&#F2003D' # Красный
      40-49: '&#B447FF' # Фиолетовый
      50-50: '&#FFD700' # Золотой
      default: '&#FFFFFF' # Белый
      
    health-indicator:
      colored-tiers:
        tier-1: '&#22E76B' # Зелёный
        tier-2: '&#528CFF' # Синий
        tier-3: '&#FFCD56' # Жёлтый
        tier-4: '&#FE803C' # Оранжевый
        tier-5: '&#F2003D' # Красный
        tier-6: '&#B447FF' # Фиолетовый
        default: '&#B447FF' # Белый
      scale: 5
      max: 5

  # Настройки спавнера LevelledMobs
  # Используйте команду: /lm spawner
    spawner-particles: 'SOUL'
    spawner-particles-count: 10

    baby-mobs-inherit-adult-setting: true

  # Разные настройки
    multipliers:
      vanilla-bonus:
        excluded-list: ['LEADER_ZOMBIE_BONUS', 'RANDOM_SPAWN_BONUS']

    sunlight-intensity: 5
    creeper-max-damage-radius: 3


#
#   ---------------  -  ------------------------------
# Раздел 04 |  Создать собственные правила
#   ---------------  -  ------------------------------
#
custom-rules:
  - custom-rule: 'Стратегия уровней в Нижнем мире'
    is-enabled: true
    conditions:
      worlds: 'world_nether'
    strategies:
      y-coordinate:
        start-height: 100
        period: 0
        end-height: 60
    settings:
      construct-level: '%y-coordinate% + %custom_nether%'

  - custom-rule: 'Стратегия уровней в Крае'
    is-enabled: true
    conditions:
      worlds: 'world_the_end'
    strategies:
      distance-from-origin:
        ringed-tiers: 200
        buffer-distance: 1000
        origin-coordinates:
          x: 0
          z: 0
    settings:
      construct-level: '%distance-from-origin% + %custom_end%'

  - custom-rule: 'Особые характеристики выбранных мобов'
    is-enabled: true
    settings:
      attribute-modifier:
        custom-attribute-modifier:
          ENDERMAN:
            max-health: 0.5
            movement-speed: 0.0
          ENDERMITE:
            max-health: 0.5
            movement-speed: 0.0
          SILVERFISH:
            max-health: 0.5
            movement-speed: 0.0
          CREEPER:
            movement-speed: 0.05

  - custom-rule: 'Бронзовая сложность для выбранных мобов'
    is-enabled: true
    use-preset: challenge-bronze
    conditions:
      entities:
        included-groups: [ 'all_flying_mobs' ]
        included-list: [ 'ZOMBIFIED_PIGLIN', 'SHULKER', 'VEX', 'RAVAGER', 'HOGLIN', 'PILLAGER', 'WANDERING_TRADER', 'VILLAGER', 'ZOMBIE_VILLAGER', 'IRON_GOLEM', 'ENDER_DRAGON', 'ELDER_GUARDIAN', 'WITHER', 'WARDEN' ]

  - custom-rule: 'Обычная сложность для выбранных мобов'
    is-enabled: true
    use-preset: challenge-vanilla
    conditions:
      entities:
        included-groups: [ 'all_passive_mobs' ]
        included-list: [ 'BABY_' ]
        excluded-list: [ 'IRON_GOLEM' ]

  - custom-rule: 'Сокращённый тег для выбранных мобов'
    is-enabled: true
    use-preset: nametag-minimized
    conditions:
      entities:
        included-groups: [ 'all_passive_mobs' ]
        included-list: [ 'BABY_', 'WANDERING_TRADER', 'VILLAGER', 'ZOMBIE_VILLAGER', 'BAT', 'ENDER_DRAGON', 'ELDER_GUARDIAN', 'WITHER', 'WARDEN', 'IRON_GOLEM' ]

  - custom-rule: 'Уменьшенная видимость тега'
    is-enabled: true
    conditions:
      entities:
        included-groups: [ 'all_passive_mobs' ]
        included-list: [ 'BAT' ]
        excluded-list: [ 'IRON_GOLEM' ]
    settings:
      nametag-visibility-method: [ 'MELEE', 'ATTACKED' ]

  - custom-rule: 'Сущности из спавнеров LevelledMobs'
    is-enabled: true
    use-preset: challenge-bronze
    conditions:
      spawn-reasons: [ 'SPAWNER' ]
    settings:
      entity-name-override:
        all_entities: 'Спавнер %displayname%'

  - custom-rule: 'Таблица пользовательского дропа брони и оружия'
    is-enabled: true
    conditions:
      entities: [ 'ZOMBIE', 'HUSK', 'PIGLIN', 'ZOMBIFIED_PIGLIN' ]
    settings:
      use-droptable-id: armor_and_weapons

  - custom-rule: 'Внешние плагины с обычными характеристиками и сокращёнными тегами'
    is-enabled: true
    use-preset: challenge-vanilla, nametag-minimized
    conditions:
      external-plugins:
        included-list: ['eco-bosses', 'mythic-mobs', 'elite-mobs', 'infernal-mobs', 'citizens', 'shop-keepers', 'simple-pets', 'elite-bosses', 'blood-night', 'combat-pets', 'deadly-disasters', 'gadgets-menu', 'my-pet']
        #excluded-list: ['*']

  - custom-rule: 'Ограничитель предметов и опыта на фермах игроков'
    is-enabled: true
    settings:
      maximum-death-in-chunk-threshold: 15
      max-adjacent-chunks: 5
      chunk-max-cooldown-seconds: 10m
      disable-vanilla-drops-on-chunk-max: false
      disable-item-boost-on-chunk-max: true
      disable-xp-boost-on-chunk-max: true

#
#   ---------------  -  ------------------------------
# Раздел 05 |  Настройки разработчика / Не редактировать дальше этого момента
#   ---------------  -  ------------------------------
#
file-version: 5
