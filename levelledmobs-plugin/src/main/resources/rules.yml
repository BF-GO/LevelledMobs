# LevelledMobs — событийный профиль «Судная неделя».
# Схема конфигурации LevelledMobs 4.5.3.2. Технические ключи и плейсхолдеры не переводятся.

presets:
  judgement-week-levels:
    name: 'Судная неделя — распределение уровней'
    strategies:
      weighted-random:
        1-49: 1228
        50-149: 501
        150-299: 267
        300-449: 160
        450-599: 94
        600-749: 47
        750-899: 20
        900-998: 15

  judgement-week-boss-levels:
    name: 'Судная неделя — распределение уровней боссов'
    strategies:
      weighted-random:
        100-199: 50
        200-299: 35
        300-399: 14
        400: 100

  judgement-week-attributes:
    name: 'Судная неделя — базовые характеристики'
    settings:
      attribute-modifier:
        merge: false
        max-health: '0.1875 * %level%'
        attack-damage: '0.075 * %level%'
        ranged-attack-damage: '0.075 * %level%'
        creeper-blast-damage: '0.00225 * %level%'
        movement-speed: '0.000075 * %level%'
        follow-range: '0.015 * %level%'
        item-drop: 0.0
        xp-drop: '0.004 * %level%'
        armor-bonus: '0.0075 * %level%'
        armor-toughness: '0.0045 * %level%'
        knockback-resistance: '0.0003 * %level%'

  judgement-week-presentation:
    name: 'Судная неделя — имена и сообщения о смерти'
    settings:
      nametag: '%mob-archetype%&8[&fУр. %mob-lvl%&8] %tiered%%displayname% &8— &c%entity-health-rounded%❤'
      creature-death-nametag: '%mob-archetype%%tiered%Ур. %mob-lvl% &f%displayname%'
      nametag-placeholder-levelled: ''
      nametag-placeholder-unlevelled: ''
      nametag-visible-time: 5s
      nametag-visibility-method: ['TARGETED', 'ATTACKED', 'TRACKING']
      entity-name-override:
        1-49:
          all_entities:
            - '&aДворовый Шорох &8(%entity-name%&8)'
            - '&aСтажёр Катастроф &8(%entity-name%&8)'
            - '&aКарманная Проблема &8(%entity-name%&8)'
            - '&aПодозрительный Шорох &8(%entity-name%&8)'
        50-149:
          all_entities:
            - '&bКусачий Стажёр &8(%entity-name%&8)'
            - '&bУчастковый Кошмар &8(%entity-name%&8)'
            - '&bСпециалист по Подзатыльникам &8(%entity-name%&8)'
            - '&bОшибка Разминки &8(%entity-name%&8)'
        150-299:
          all_entities:
            - '&eРайонный Кошмар &8(%entity-name%&8)'
            - '&eМясной Специалист &8(%entity-name%&8)'
            - '&eСтарший по Засадам &8(%entity-name%&8)'
            - '&eВнеплановая Боль &8(%entity-name%&8)'
        300-449:
          all_entities:
            - '&6Завхоз Преисподней &8(%entity-name%&8)'
            - '&6Сертифицированная Проблема &8(%entity-name%&8)'
            - '&6Налоговая из Ада &8(%entity-name%&8)'
            - '&6Начальник Коридора &8(%entity-name%&8)'
        450-599:
          all_entities:
            - '&cНачальник Разноса &8(%entity-name%&8)'
            - '&cИнспектор Плохих Решений &8(%entity-name%&8)'
            - '&cЗамдиректора Могилы &8(%entity-name%&8)'
            - '&cНачальник Смены Апокалипсиса &8(%entity-name%&8)'
        600-749:
          all_entities:
            - '&4Директор по Люлям &8(%entity-name%&8)'
            - '&4Отдел Ликвидации &8(%entity-name%&8)'
            - '&4Главный по Техработам &8(%entity-name%&8)'
            - '&4Менеджер Последствий &8(%entity-name%&8)'
        750-899:
          all_entities:
            - '&5Министр Катастроф &8(%entity-name%&8)'
            - '&5Ошибка Баланса &8(%entity-name%&8)'
            - '&5Начальник Конца Смены &8(%entity-name%&8)'
            - '&5Замминистра Паники &8(%entity-name%&8)'
        900-998:
          all_entities:
            - '&#FF3B00Причина Вайпа &8(%entity-name%&8)'
            - '&#FF3B00Заместитель Судного Дня &8(%entity-name%&8)'
            - '&#FF3B00Финальный Аргумент Сервера &8(%entity-name%&8)'
            - '&#FF3B00Владелец Твоего Тикета &8(%entity-name%&8)'
        999:
          all_entities:
            - '&#FF0000&lГендиректор Апокалипсиса &8(%entity-name%&8)'
            - '&#FF0000&lГлавный по Твоей Могиле &8(%entity-name%&8)'
            - '&#FF0000&lПоследняя Ошибка Баланса &8(%entity-name%&8)'
            - '&#FF0000&lСудный День с Лапками &8(%entity-name%&8)'
      tiered-coloring:
        1-49: '&a'
        50-149: '&b'
        150-299: '&e'
        300-449: '&6'
        450-599: '&c'
        600-749: '&4'
        750-899: '&5'
        900-998: '&#FF3B00'
        999: '&#FF0000&l'
        default: '&f'
      death-messages:
        5:
          - '%player% не прошёл испытательный срок у %death_nametag%.'
          - '%death_nametag% оформил %player% внеплановый выход из онлайна.'
          - '%player% нажал не ту кнопку рядом с %death_nametag%.'
          - '%death_nametag% выписал %player% квитанцию за плохое решение.'
          - '%player% познакомился с отделом последствий: %death_nametag%.'
          - '%death_nametag% отправил %player% перечитать правила выживания.'
          - '%player% проиграл собеседование на должность живого у %death_nametag%.'
          - '%death_nametag% закрыл тикет %player% вместе с заявителем.'
        3:
          - '%player% пытался договориться с %death_nametag%, но печать уже поставили.'
          - '%death_nametag% провёл для %player% ускоренный курс по гравитации.'
          - '%player% обнаружил, что у %death_nametag% сегодня приём без записи.'
          - '%death_nametag% внёс %player% в реестр внезапно закончившихся героев.'
          - '%player% запросил лёгкий режим. %death_nametag% отклонил заявление.'
          - '%death_nametag% объяснил %player%, где заканчивается уверенность.'
          - '%player% принёс меч на совещание с %death_nametag%. Совещание окончено.'
          - '%death_nametag% выдал %player% бессрочный отпуск от приключений.'
        1:
          - '%player% нашёл финального босса в лице %death_nametag%. Это был не финальный босс.'
          - '%death_nametag% превратил стратегию %player% в исторический документ.'
          - '%player% попросил минутку. %death_nametag% выдал полсекунды.'
          - '%death_nametag% доказал %player%, что план «авось» не прошёл сертификацию.'
          - '%player% был уверен в броне, пока %death_nametag% не прочитал её гарантию.'
          - '%death_nametag% назначил %player% главным специалистом по лежанию.'
          - '%player% увидел %death_nametag% и выбрал неверный пункт диалога.'
          - '%death_nametag% завершил презентацию %player% одним убедительным слайдом.'

default-rule:
  use-preset:
    - judgement-week-levels
    - judgement-week-attributes
    - judgement-week-presentation
  conditions:
    worlds: ['*']
    entities:
      included-groups: ['all_hostile_mobs']
      included-list: [BEE, DOLPHIN, GOAT, IRON_GOLEM, LLAMA, PANDA, PIGLIN, POLAR_BEAR, TRADER_LLAMA, WOLF, ZOMBIFIED_PIGLIN]
      excluded-list: ['BABY_', ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]
    external-plugins:
      excluded-list: ['*']
    mob-customname-status: EITHER
    mob-tamed-status: NOT_TAMED
  settings:
    minLevel: 1
    maxLevel: 998
    construct-level: '%weighted-random%'
    use-custom-item-drops-for-mobs: true
    baby-mobs-inherit-adult-setting: false
    level-inheritance: false
    passenger-match-level: false
    multipliers:
      vanilla-bonus:
        excluded-list: [LEADER_ZOMBIE_BONUS, RANDOM_SPAWN_BONUS]
    creeper-max-damage-radius: 6
    maximum-death-in-chunk-threshold: 15
    max-adjacent-chunks: 5
    chunk-max-cooldown-seconds: 10m
    disable-vanilla-drops-on-chunk-max: false
    disable-item-boost-on-chunk-max: true
    disable-xp-boost-on-chunk-max: true

custom-rules:
  # Это правило намеренно первое: выигравший шанс прекращает дальнейшее объединение правил.
  - custom-rule: 'Судная неделя — естественный моб 999-го уровня'
    is-enabled: true
    use-preset: judgement-week-presentation
    conditions:
      worlds: ['*']
      spawn-reasons: [NATURAL]
      chance: 0.002499
      stop-processing: true
      entities:
        included-groups: ['all_hostile_mobs']
        included-list: [BEE, DOLPHIN, GOAT, IRON_GOLEM, LLAMA, PANDA, PIGLIN, POLAR_BEAR, TRADER_LLAMA, WOLF, ZOMBIFIED_PIGLIN]
        excluded-list: ['BABY_', ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]
      external-plugins:
        excluded-list: ['*']
      mob-tamed-status: NOT_TAMED
    settings:
      minLevel: 999
      maxLevel: 999
      construct-level: '999'
      level-inheritance: false
      passenger-match-level: false
      creeper-max-damage-radius: 6
      attribute-modifier:
        do-not-merge-any: true
        max-health: '0.3375 * %level%'
        attack-damage: '0.12 * %level%'
        ranged-attack-damage: '0.12 * %level%'
        creeper-blast-damage: '0.003 * %level%'
        movement-speed: '0.0001125 * %level%'
        follow-range: '0.0225 * %level%'
        item-drop: 0.0
        xp-drop: '0.004 * %level%'
        armor-bonus: '0.01125 * %level%'
        armor-toughness: '0.00675 * %level%'
        knockback-resistance: '0.00045 * %level%'

  - custom-rule: 'Судная неделя — отдельная шкала боссов'
    is-enabled: true
    use-preset:
      - judgement-week-boss-levels
      - judgement-week-attributes
      - judgement-week-presentation
    conditions:
      worlds: ['*']
      entities: [ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]
      external-plugins:
        excluded-list: ['*']
    settings:
      minLevel: 100
      maxLevel: 400
      construct-level: '%weighted-random%'
      use-custom-item-drops-for-mobs: true
      level-inheritance: false
      passenger-match-level: false
      creeper-max-damage-radius: 6

  - custom-rule: 'Судная неделя — ограничение фермерских источников'
    is-enabled: true
    conditions:
      worlds: ['*']
      spawn-reasons: [SPAWNER, TRIAL_SPAWNER, SPAWNER_EGG, DISPENSE_EGG, BREEDING, REINFORCEMENTS, SLIME_SPLIT, BUILD_IRONGOLEM]
      entities:
        included-groups: ['all_hostile_mobs']
        included-list: [BEE, DOLPHIN, GOAT, IRON_GOLEM, LLAMA, PANDA, PIGLIN, POLAR_BEAR, TRADER_LLAMA, WOLF, ZOMBIFIED_PIGLIN, ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]
        excluded-list: ['BABY_']
      mob-tamed-status: NOT_TAMED
    strategies:
      random: true
    settings:
      minLevel: 1
      maxLevel: 50
      construct-level: '%random%'
      use-custom-item-drops-for-mobs: false
      attribute-modifier:
        item-drop: 0.0
        xp-drop: 0.0

  - custom-rule: 'Судная неделя — ночное усиление'
    is-enabled: true
    conditions:
      worlds: ['*']
      world-time-tick: 13000-23000
      entities:
        included-groups: ['all_hostile_mobs']
        included-list: [BEE, DOLPHIN, GOAT, IRON_GOLEM, LLAMA, PANDA, PIGLIN, POLAR_BEAR, TRADER_LLAMA, WOLF, ZOMBIFIED_PIGLIN, ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]
        excluded-list: ['BABY_']
      mob-tamed-status: NOT_TAMED
    settings:
      attribute-modifier:
        max-health: '0.20625 * %level%'
        attack-damage: '0.0825 * %level%'
        ranged-attack-damage: '0.0825 * %level%'
        creeper-blast-damage: '0.002475 * %level%'

  - custom-rule: 'Судная неделя — пещерное усиление'
    is-enabled: true
    conditions:
      worlds: ['*']
      skylight-level: 0-7
      entities:
        included-groups: ['all_hostile_mobs']
        included-list: [BEE, DOLPHIN, GOAT, IRON_GOLEM, LLAMA, PANDA, PIGLIN, POLAR_BEAR, TRADER_LLAMA, WOLF, ZOMBIFIED_PIGLIN, ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]
        excluded-list: ['BABY_']
      mob-tamed-status: NOT_TAMED
    settings:
      attribute-modifier:
        max-health: '0.20625 * %level%'
        attack-damage: '0.0825 * %level%'
        ranged-attack-damage: '0.0825 * %level%'
        creeper-blast-damage: '0.002475 * %level%'

  - custom-rule: 'Судная неделя — усиление Нижнего мира'
    is-enabled: true
    conditions:
      worlds: [world_nether]
      entities:
        included-groups: ['all_hostile_mobs']
        included-list: [BEE, DOLPHIN, GOAT, IRON_GOLEM, LLAMA, PANDA, PIGLIN, POLAR_BEAR, TRADER_LLAMA, WOLF, ZOMBIFIED_PIGLIN, ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]
        excluded-list: ['BABY_']
      mob-tamed-status: NOT_TAMED
    settings:
      attribute-modifier:
        max-health: '0.215625 * %level%'
        attack-damage: '0.08625 * %level%'
        ranged-attack-damage: '0.08625 * %level%'
        creeper-blast-damage: '0.0025875 * %level%'

  - custom-rule: 'Судная неделя — усиление Края'
    is-enabled: true
    conditions:
      worlds: [world_the_end]
      entities:
        included-groups: ['all_hostile_mobs']
        included-list: [BEE, DOLPHIN, GOAT, IRON_GOLEM, LLAMA, PANDA, PIGLIN, POLAR_BEAR, TRADER_LLAMA, WOLF, ZOMBIFIED_PIGLIN, ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]
        excluded-list: ['BABY_']
      mob-tamed-status: NOT_TAMED
    settings:
      attribute-modifier:
        max-health: '0.225 * %level%'
        attack-damage: '0.09 * %level%'
        ranged-attack-damage: '0.09 * %level%'
        creeper-blast-damage: '0.0027 * %level%'

  # Правило обнуляет профиль у мобов, которыми управляют внешние плагины.
  - custom-rule: 'Внешние плагины — без событийного уровня'
    is-enabled: true
    conditions:
      worlds: ['*']
      external-plugins:
        included-list: ['*']
      stop-processing: true
    strategies:
      weighted-random: false
    settings:
      minLevel: 0
      maxLevel: 0
      construct-level: '0'
      use-custom-item-drops-for-mobs: false
      nametag: disabled
      nametag-visibility-method: [DISABLED]
      attribute-modifier:
        do-not-merge-any: true
        max-health: 0.0
        attack-damage: 0.0
        ranged-attack-damage: 0.0
        creeper-blast-damage: 0.0
        movement-speed: 0.0
        follow-range: 0.0
        item-drop: 0.0
        xp-drop: 0.0
        armor-bonus: 0.0
        armor-toughness: 0.0
        knockback-resistance: 0.0

  - custom-rule: 'Судная неделя — защита от фарма в чанках'
    is-enabled: true
    conditions:
      worlds: ['*']
      entities:
        included-groups: ['all_hostile_mobs']
        included-list: [BEE, DOLPHIN, GOAT, IRON_GOLEM, LLAMA, PANDA, PIGLIN, POLAR_BEAR, TRADER_LLAMA, WOLF, ZOMBIFIED_PIGLIN, ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]
        excluded-list: ['BABY_']
      mob-tamed-status: NOT_TAMED
    settings:
      maximum-death-in-chunk-threshold: 15
      max-adjacent-chunks: 5
      chunk-max-cooldown-seconds: 10m
      disable-vanilla-drops-on-chunk-max: false
      disable-item-boost-on-chunk-max: true
      disable-xp-boost-on-chunk-max: true

